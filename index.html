<!doctype html>
<input id="j" type="password" placeholder="JWT">
<button onclick="test()">Test CORS</button>
<pre id="o"></pre>
<script>
const j=document.getElementById('j'),o=document.getElementById('o');
async function test(){
  try{
    const r=await fetch('https://aigw-preprod.np.six-group.com/fd-mcp/v1/mcp',{
      method:'POST',
      headers:{Authorization:'Bearer '+j.value,'Content-Type':'application/json',Accept:'application/json, text/event-stream','MCP-Protocol-Version':'2025-11-25'},
      body:'{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}'
    });
    o.textContent='CORS RESPONSE READABLE\nHTTP '+r.status+'\n'+await r.text();
  }catch(e){o.textContent='BROWSER BLOCKED\n'+e}
  j.value='';
}
</script>
