<!DOCTYPE html>
<html>
<body>
<h2>CORS Test</h2>

<pre id="result">Loading...</pre>

<script>
fetch("https://uat.selfcare.ooredoo.qa/b2b-portal-uat2/endUserRegistration/editEndUserModal.html", {
    credentials: "include"
})
.then(r => r.text())
.then(data => {
    document.getElementById("result").innerText = data;
})
.catch(err => {
    document.getElementById("result").innerText = err;
});
</script>

</body>
</html>
